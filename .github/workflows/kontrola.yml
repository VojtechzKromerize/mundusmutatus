name: Kontrola webu
# Při každém nahrání (a u pull requestů) sestaví web a vyzkouší ho: že do hráčské verze neproteklo žádné tajemství,
# že databáze nepustí hráče k obsahu vypravěče, že kód nemá zdvojená či neznámá jména a pak v prohlížeči odhalování,
# herní stav, boj, karty, editor, zápisy Kroniky, pečeť a že všechny stránky jdou otevřít bez chyb.
# Výsledek je vidět u commitu (✓ / ✗); chyby jsou v anotacích (`gh run view <id>`), snímky obrazovky v příloze běhu.
# Nepotřebuje žádná tajemství – Supabase nahrazuje testovací databáze přímo v běhu.
#
# Rozdělení (2026-10-21): „Rychlá kontrola“ (sestavení, tajemství, kontrola kódu, schéma, práva; ~1 min) doběhne vždy –
# novější nahrání ji neruší, takže každý commit má aspoň rychlý výsledek. Testy v prohlížeči běží v šesti
# souběžných částech (2026-10-22, dřív čtyři; každá ~2–3 min); novější nahrání do stejné větve rozběhnuté části zruší
# (výsledek platí pro poslední stav). Délky testů vypisuje testy/spustit.sh („✓ název (37 s)“) – podle nich se části
# vyvažují (místně 2026-10-22: karta 185 s, boj2 117, karta_vse 86, boj 75, reakce 57, potvrz 44, prohlídka db 105,
# statická + bestiář 81, ostatní do 25 s).
# Nástroje: psql i knihovny Chromu na runneru jsou (instalují se, jen když chybí) – apt-get při každém běhu dřív stál
# ~30 s a jednou (zámek aptu) 9 minut.
on:
  push:
    branches: [main, dev]
    paths-ignore: ["README.md", "CLAUDE.md", "LICENSE", "testy/README.md", "zdroj/obsah/NÁVOD.md", "podklady/**", "supabase/functions/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres
  POSTGREST: /tmp/postgrest
  MM_VYSTUP: /tmp/testy-snimky
jobs:
  rychla:
    name: Rychlá kontrola
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Nástroje
        run: |
          npm ci --no-audit --no-fund
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client >/dev/null
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ -C /tmp
      - name: Kontrola
        run: MM_RYCHLA=1 bash testy/spustit.sh

  prohlizec:
    name: Prohlížeč – ${{ matrix.cast }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: kontrola-${{ github.ref }}-${{ matrix.cast }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - cast: karta
            testy: "karta"
            prohlidky: ""
          - cast: boj a tah
            testy: "boj2 tah"
            prohlidky: ""
          - cast: boj a reakce
            testy: "boj reakce"
            prohlidky: ""
          - cast: potvrzování, karta – ostatní, editor
            testy: "potvrz karta_vse pecet editor" # potvrz před karta_vse: po něm zůstává stav, ve kterém potvrzování léčení neprojde
            prohlidky: ""
          - cast: statické stránky a bestiář
            testy: "odhalovani herni_stav draci zapisy"
            prohlidky: "staticka"
          - cast: prohlídka hráče a vypravěče
            testy: "vyprava"
            prohlidky: "db"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Nástroje
        id: nastroje
        run: |
          npm ci --no-audit --no-fund
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client >/dev/null
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ -C /tmp
          pip install -q playwright pillow
          echo "playwright=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"
      # klíč podle verze Playwrightu: s novou verzí se Chromium stáhne jednou a pak je zase z mezipaměti
      - name: Mezipaměť prohlížeče
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.nastroje.outputs.playwright }}
      - name: Prohlížeč
        run: python -m playwright install chromium
      - name: Kontrola
        env:
          MM_TESTY: ${{ matrix.testy }}
          MM_PROHLIDKY: ${{ matrix.prohlidky }}
        run: bash testy/spustit.sh
      - name: Snímky obrazovky při chybě
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testy-snimky-${{ strategy.job-index }}
          path: /tmp/testy-snimky
          if-no-files-found: ignore

  souhrn:
    name: Od posledního zeleného stavu
    needs: [rychla, prohlizec]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Poslední zelený commit a změny od něj
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow kontrola.yml --branch "$GITHUB_REF_NAME" --status success -L 1 --json headSha -q '.[0].headSha' || true)
          if [ -z "$sha" ]; then echo "::warning title=Poslední zelený commit::žádný úspěšný běh na větvi $GITHUB_REF_NAME"; exit 0; fi
          zm=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq '[.commits[] | (.sha[0:7] + " " + (.commit.message | split("\n")[0]))] | join(" · ")' | cut -c1-900)
          echo "::error title=Poslední zelený commit ${sha:0:7}::změny od něj: $zm"
          { echo "### Poslední zelený commit: \`${sha:0:7}\`"; echo; echo "$zm" | tr '·' '\n' | sed 's/^ */- /'; } >> "$GITHUB_STEP_SUMMARY"
