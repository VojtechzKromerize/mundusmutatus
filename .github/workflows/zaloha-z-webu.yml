name: Záloha textů z webu
# Každou hodinu (a kdykoli ručně: Actions → Záloha textů z webu → Run workflow) uloží texty upravené
# na webu do souborů v zdroj/obsah ve větvi dev. Potřebuje v GitHubu tajemství SUPABASE_SECRET
# (Settings → Secrets and variables → Actions → New repository secret).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: zaloha
jobs:
  zaloha:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://rzbflnwxpyepjcpndqyj.supabase.co
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stáhnout texty upravené na webu
        run: python3 zdroj/zaloha.py --vystup "$RUNNER_TEMP/zaloha.json"
      - name: Uložit do gitu (větev dev)
        run: |
          git config user.name "Záloha z webu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A zdroj/obsah
          if git diff --cached --quiet; then
            echo "Žádné nové změny."
          else
            git commit -m "Záloha textů z webu ($(date -u +%Y-%m-%d))"
            git push origin HEAD:dev
          fi
      - name: Potvrdit zálohu v databázi
        run: python3 zdroj/zaloha.py --potvrdit "$RUNNER_TEMP/zaloha.json"
